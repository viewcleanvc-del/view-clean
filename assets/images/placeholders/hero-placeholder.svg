<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b2e" />
      <stop offset="50%" stop-color="#0f3d64" />
      <stop offset="100%" stop-color="#185a8c" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29a8e2" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <pattern id="gridHero" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#29a8e2" stroke-width="0.8" stroke-opacity="0.12" />
    </pattern>
    <filter id="glowHero" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgHeroGrad)" />
  <rect width="1200" height="700" fill="url(#gridHero)" />

  <!-- Modern High-Rise Blueprint Outlines -->
  <g opacity="0.22" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <!-- Tower 1 -->
    <rect x="140" y="180" width="160" height="520" rx="4" />
    <line x1="140" y1="240" x2="300" y2="240" />
    <line x1="140" y1="300" x2="300" y2="300" />
    <line x1="140" y1="360" x2="300" y2="360" />
    <line x1="140" y1="420" x2="300" y2="420" />
    <line x1="140" y1="480" x2="300" y2="480" />
    <line x1="140" y1="540" x2="300" y2="540" />
    <line x1="140" y1="600" x2="300" y2="600" />
    <!-- Tower 2 Center Tall -->
    <polygon points="900,100 1060,100 1060,700 900,700" />
    <line x1="980" y1="100" x2="980" y2="700" stroke-dasharray="6,6" />
    <!-- Diagonal Guides -->
    <line x1="0" y1="0" x2="1200" y2="700" stroke-dasharray="10,10" />
    <line x1="1200" y1="0" x2="0" y2="700" stroke-dasharray="10,10" />
    <circle cx="600" cy="350" r="280" stroke="#29a8e2" stroke-width="1" stroke-dasharray="8,8" />
  </g>

  <!-- Central Card -->
  <rect x="300" y="190" width="600" height="320" rx="20" fill="#081e33" fill-opacity="0.9" stroke="#29a8e2" stroke-width="2" filter="url(#glowHero)" />

  <!-- Top Badge -->
  <g transform="translate(425, 220)">
    <rect width="350" height="36" rx="18" fill="#144d7d" stroke="#38bdf8" stroke-width="1.2" />
    <text x="175" y="24" fill="#38bdf8" font-family="'Cairo', 'Tajawal', sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      مساحة مخصصة للصورة الرئيسية للمشروع
    </text>
  </g>

  <!-- Title & Info -->
  <text x="600" y="315" fill="#ffffff" font-family="'Cairo', 'Tajawal', sans-serif" font-size="26" font-weight="800" text-anchor="middle">
    فيو كلين
  </text>
  <text x="600" y="355" fill="#93c5fd" font-family="'Cairo', 'Tajawal', sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    حلول نظافة متكاملة للأفراد والمنشآت
  </text>
  <text x="600" y="395" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1">
    View Clean • Hero Banner Official Image Area
  </text>

  <!-- Bottom Dimension Notice -->
  <g transform="translate(360, 430)">
    <rect width="480" height="50" rx="10" fill="#051321" stroke="#1d4ed8" stroke-width="1" />
    <text x="240" y="31" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-size="13" text-anchor="middle">
      يمكن استبدال هذا النموذج بسهولة بصورة عالية الدقة (1200 × 700 بكسل)
    </text>
  </g>

  <!-- Sparkles -->
  <g fill="#38bdf8">
    <path d="M 330 220 l 5 10 l 10 5 l -10 5 l -5 10 l -5 -10 l -10 -5 l 10 -5 z" />
    <path d="M 870 480 l 4 8 l 8 4 l -8 4 l -4 8 l -4 -8 l -8 -4 l 8 -4 z" />
  </g>
</svg>
