<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061826" />
      <stop offset="50%" stop-color="#0c3558" />
      <stop offset="100%" stop-color="#19639e" />
    </linearGradient>
    <pattern id="gridGlass" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.15" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bgGlass)" />
  <rect width="800" height="500" fill="url(#gridGlass)" />
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <rect x="250" y="60" width="300" height="380" rx="8" />
    <line x1="250" y1="140" x2="550" y2="140" />
    <line x1="250" y1="220" x2="550" y2="220" />
    <line x1="250" y1="300" x2="550" y2="300" />
    <line x1="250" y1="380" x2="550" y2="380" />
    <line x1="350" y1="60" x2="350" y2="440" />
    <line x1="450" y1="60" x2="450" y2="440" />
    <!-- Rope Descent Line -->
    <line x1="300" y1="0" x2="300" y2="500" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
  </g>
  <rect x="140" y="100" width="520" height="300" rx="16" fill="#081e33" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
  <g transform="translate(250, 130)">
    <rect width="300" height="30" rx="15" fill="#144d7d" stroke="#38bdf8" stroke-width="1" />
    <text x="150" y="20" fill="#38bdf8" font-family="'Cairo', 'Tajawal', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      خدمة 01 • تنظيف الواجهات الزجاجية
    </text>
  </g>
  <text x="400" y="215" fill="#ffffff" font-family="'Cairo', 'Tajawal', sans-serif" font-size="22" font-weight="800" text-anchor="middle">
    تنظيف الواجهات الزجاجية للأبراج
  </text>
  <text x="400" y="255" fill="#93c5fd" font-family="'Cairo', 'Tajawal', sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    تقنيات النزول بالحبال (Rope Access) والرافعات المتطورة
  </text>
  <text x="400" y="295" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    Glass Facade Cleaning • Image Placeholder
  </text>
  <g transform="translate(200, 330)">
    <rect width="400" height="42" rx="8" fill="#051321" stroke="#1d4ed8" stroke-width="1" />
    <text x="200" y="26" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-size="12" text-anchor="middle">
      مساحة مخصصة لصورة حقيقية لأعمال تنظيف زجاج الواجهات
    </text>
  </g>
</svg>
